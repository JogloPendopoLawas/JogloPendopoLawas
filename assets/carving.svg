<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Ukiran klasik Jawa pada permukaan kayu jati">
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#6b4020"/>
      <stop offset="0.45" stop-color="#472711"/>
      <stop offset="1" stop-color="#231207"/>
    </linearGradient>
    <linearGradient id="carveLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e5b97f"/>
      <stop offset="1" stop-color="#a36c37"/>
    </linearGradient>
    <radialGradient id="spot" cx="42%" cy="34%" r="70%">
      <stop offset="0" stop-color="#f2c78f" stop-opacity="0.32"/>
      <stop offset="0.6" stop-color="#000000" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.62"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.003 0.1" numOctaves="5" seed="21" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.7"/></feComponentTransfer>
    </filter>
    <filter id="relief" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.4" flood-color="#120903" flood-opacity="0.8"/>
    </filter>
  </defs>

  <rect width="900" height="900" fill="url(#wood)"/>
  <g fill="none" stroke="#2a1609" stroke-opacity="0.4" stroke-linecap="round">
    <path d="M-20 120 C 220 90, 420 160, 660 120 S 860 90, 940 130" stroke-width="4"/>
    <path d="M-20 330 C 180 360, 430 290, 650 350 S 860 390, 940 340" stroke-width="3"/>
    <path d="M-20 620 C 220 580, 430 670, 660 620 S 870 590, 940 650" stroke-width="4"/>
    <path d="M-20 800 C 200 830, 430 760, 660 810 S 870 840, 940 790" stroke-width="3"/>
  </g>

  <!-- carved frame -->
  <g fill="none" stroke="url(#carveLight)" filter="url(#relief)">
    <rect x="64" y="64" width="772" height="772" stroke-width="2" stroke-opacity="0.6"/>
    <rect x="82" y="82" width="736" height="736" stroke-width="1" stroke-opacity="0.35"/>
  </g>

  <g transform="translate(450 450)" fill="none" stroke="url(#carveLight)" stroke-linecap="round" filter="url(#relief)">
    <!-- outer medallion -->
    <circle r="252" stroke-width="1.6" stroke-opacity="0.55"/>
    <circle r="232" stroke-width="1" stroke-opacity="0.35" stroke-dasharray="3 14"/>
    <rect x="-176" y="-176" width="352" height="352" transform="rotate(45)" stroke-width="1.4" stroke-opacity="0.45"/>

    <!-- eight-petal lotus -->
    <g stroke-width="2.6">
      <ellipse rx="42" ry="118" cy="-58" stroke-opacity="0.9"/>
      <ellipse rx="42" ry="118" cy="-58" transform="rotate(45)" stroke-opacity="0.9"/>
      <ellipse rx="42" ry="118" cy="-58" transform="rotate(90)" stroke-opacity="0.9"/>
      <ellipse rx="42" ry="118" cy="-58" transform="rotate(135)" stroke-opacity="0.9"/>
      <ellipse rx="42" ry="118" cy="-58" transform="rotate(180)" stroke-opacity="0.9"/>
      <ellipse rx="42" ry="118" cy="-58" transform="rotate(225)" stroke-opacity="0.9"/>
      <ellipse rx="42" ry="118" cy="-58" transform="rotate(270)" stroke-opacity="0.9"/>
      <ellipse rx="42" ry="118" cy="-58" transform="rotate(315)" stroke-opacity="0.9"/>
    </g>
    <circle r="40" stroke-width="2.4" stroke-opacity="0.95"/>
    <circle r="18" stroke-width="1.6" stroke-opacity="0.8"/>
    <circle r="7" fill="url(#carveLight)" fill-opacity="0.7" stroke="none"/>

    <!-- curling vines in the four corners -->
    <g stroke-width="2.2" stroke-opacity="0.85">
      <path d="M120 -120 C 196 -186, 268 -150, 262 -78 C 257 -20, 190 -4, 168 -52 C 150 -92, 196 -114, 216 -88"/>
      <path d="M-120 -120 C -196 -186, -268 -150, -262 -78 C -257 -20, -190 -4, -168 -52 C -150 -92, -196 -114, -216 -88"/>
      <path d="M120 120 C 196 186, 268 150, 262 78 C 257 20, 190 4, 168 52 C 150 92, 196 114, 216 88"/>
      <path d="M-120 120 C -196 186, -268 150, -262 78 C -257 20, -190 4, -168 52 C -150 92, -196 114, -216 88"/>
    </g>
    <g fill="url(#carveLight)" fill-opacity="0.35" stroke="none">
      <ellipse cx="222" cy="-160" rx="14" ry="7" transform="rotate(-32 222 -160)"/>
      <ellipse cx="-222" cy="-160" rx="14" ry="7" transform="rotate(32 -222 -160)"/>
      <ellipse cx="222" cy="160" rx="14" ry="7" transform="rotate(32 222 160)"/>
      <ellipse cx="-222" cy="160" rx="14" ry="7" transform="rotate(-32 -222 160)"/>
    </g>

    <!-- outer scroll beads -->
    <g stroke-width="1.4" stroke-opacity="0.5">
      <path d="M-252 0 A 252 252 0 0 1 -178 -178"/>
      <path d="M252 0 A 252 252 0 0 1 178 -178"/>
      <path d="M-252 0 A 252 252 0 0 0 -178 178"/>
      <path d="M252 0 A 252 252 0 0 0 178 178"/>
    </g>
  </g>

  <rect width="900" height="900" filter="url(#grain)" opacity="0.4" style="mix-blend-mode:multiply"/>
  <rect width="900" height="900" fill="url(#spot)"/>
</svg>
